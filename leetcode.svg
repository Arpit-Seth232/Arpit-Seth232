<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ac3de" />
      <stop offset="50%" stop-color="#7aa2f7" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>
    
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e" />
      <stop offset="100%" stop-color="#0f0f14" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d59a1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { r: 3px; opacity: 0.8; }
      50% { r: 5.5px; opacity: 1; }
      100% { r: 3px; opacity: 0.8; }
    }
    .bg { fill: url(#cardBg); rx: 12px; stroke: url(#borderGrad); stroke-width: 1.5px; }
    .title { font: 700 15px "Segoe UI", system-ui, sans-serif; fill: #7dcfff; letter-spacing: 0.3px; }
    .badge-text { font: 700 12px "Segoe UI", system-ui, sans-serif; fill: #ff9e64; }
    .sub-text { font: 500 11px "Segoe UI", system-ui, sans-serif; fill: #a9b1d6; }
    .grid { stroke: #565f89; stroke-opacity: 0.2; stroke-dasharray: 4; }
    .line { fill: none; stroke: url(#lineGrad); stroke-width: 2.8; stroke-linejoin: round; filter: url(#glow); }
    .area { fill: url(#areaGrad); }
    .label { font: 500 10px "Segoe UI", system-ui, sans-serif; fill: #565f89; }
    .dot { fill: #2ac3de; stroke: #16161e; stroke-width: 1.2; }
    .latest-dot { fill: #bb9af7; stroke: #ffffff; stroke-width: 1.5; animation: pulse 2s infinite ease-in-out; filter: url(#glow); }
    .easy { fill: #9ece6a; font-weight: 700; }
    .med { fill: #e0af68; font-weight: 700; }
    .hard { fill: #f7768e; font-weight: 700; }
  </style>

