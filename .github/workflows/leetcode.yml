name: Update LeetCode Stats SVG

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'leetcode.svg'

jobs:
  update-leetcode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Data & Generate Animated Cyberpunk LeetCode SVG
        run: |
          python -c '
          import urllib.request
          import json

          username = "Arpit_Seth"
          query = """
          query getContestStats($username: String!) {
            matchedUser(username: $username) {
              submitStats {
                acSubmissionNum {
                  difficulty
                  count
                }
              }
            }
            userContestRanking(username: $username) {
              rating
              globalRanking
            }
            userContestRankingHistory(username: $username) {
              attended
              rating
            }
          }
          """

          req = urllib.request.Request(
              "https://leetcode.com/graphql",
              data=json.dumps({"query": query, "variables": {"username": username}}).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"}
          )

          try:
              with urllib.request.urlopen(req) as response:
                  res = json.loads(response.read().decode())
                  
                  stats = res["data"]["matchedUser"]["submitStats"]["acSubmissionNum"]
                  total = next(item["count"] for item in stats if item["difficulty"] == "All")
                  easy = next(item["count"] for item in stats if item["difficulty"] == "Easy")
                  medium = next(item["count"] for item in stats if item["difficulty"] == "Medium")
                  hard = next(item["count"] for item in stats if item["difficulty"] == "Hard")
                  
                  contest = res["data"].get("userContestRanking")
                  current_rating = round(contest.get("rating", 1691)) if contest else 1691
                  
                  g_rank = contest.get("globalRanking") if contest else None
                  global_rank = f"{g_rank:,}" if g_rank is not None else "N/A"
                  
                  history = res["data"].get("userContestRankingHistory") or []
                  attended = [c for c in history if c.get("attended")]
                  ratings = [round(c["rating"]) for c in attended] if attended else [1500, current_rating]
                  peak_rating = max(ratings) if ratings else current_rating

                  width, height = 495, 195
                  pad_x, pad_y_top, pad_y_bottom = 45, 62, 38
                  graph_w = width - (pad_x * 2)
                  graph_h = height - pad_y_top - pad_y_bottom
                  
                  min_r = min(ratings) - 20
                  max_r = max(ratings) + 20
                  r_range = max_r - min_r if max_r != min_r else 100

                  points = []
                  n = len(ratings)
                  for i, r in enumerate(ratings):
                      x = pad_x if n == 1 else pad_x + (i / (n - 1)) * graph_w
                      y = height - pad_y_bottom - ((r - min_r) / r_range) * graph_h
                      points.append((x, y))

                  poly_points = " ".join([f"{x:.1f},{y:.1f}" for x, y in points])
                  area_points = f"{pad_x},{height-pad_y_bottom} " + poly_points + f" {width-pad_x},{height-pad_y_bottom}"

                  last_x, last_y = points[-1] if points else (pad_x, height - pad_y_bottom)

                  dots_html = ""
                  for idx, (x, y) in enumerate(points):
                      if idx < len(points) - 1:
                          dots_html += f"""<circle cx="{x:.1f}" cy="{y:.1f}" r="2.5" class="dot" />"""

                  svg = f"""<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#1f2335" />
                <stop offset="100%" stop-color="#121319" />
              </linearGradient>

              <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7dcfff" stop-opacity="0.6"/>
                <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#f7768e" stop-opacity="0.6"/>
              </linearGradient>

              <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#0db9d7" />
                <stop offset="35%" stop-color="#7dcfff" />
                <stop offset="70%" stop-color="#bb9af7" />
                <stop offset="100%" stop-color="#f7768e" />
              </linearGradient>
              
              <linearGradient id="areaGlow" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#7dcfff" stop-opacity="0.35" />
                <stop offset="60%" stop-color="#bb9af7" stop-opacity="0.10" />
                <stop offset="100%" stop-color="#1f2335" stop-opacity="0.0" />
              </linearGradient>

              <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2.5" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <style>
              @keyframes drawPath {{
                0% {{ stroke-dashoffset: 1200; }}
                100% {{ stroke-dashoffset: 0; }}
              }}
              @keyframes fadeIn {{
                0% {{ opacity: 0; }}
                100% {{ opacity: 1; }}
              }}
              @keyframes pulseRing {{
                0% {{ r: 3px; opacity: 1; stroke-width: 1.5px; }}
                100% {{ r: 13px; opacity: 0; stroke-width: 0px; }}
              }}
              @keyframes beaconPulse {{
                0%, 100% {{ r: 4px; fill: #ffffff; }}
                50% {{ r: 6px; fill: #f7768e; }}
              }}

              .bg {{ fill: url(#cardBg); rx: 14px; stroke: url(#borderGrad); stroke-width: 1.5px; }}
              .title {{ font: 700 15px "Segoe UI", Ubuntu, sans-serif; fill: #7dcfff; filter: drop-shadow(0px 0px 4px rgba(125,207,255,0.4)); }}
              .badge-val {{ font: 700 12px "Segoe UI", Ubuntu, sans-serif; fill: #ff9e64; }}
              .sub-text {{ font: 500 11px "Segoe UI", Ubuntu, sans-serif; fill: #c0caf5; }}
              .grid {{ stroke: #292e42; stroke-dasharray: 4; stroke-width: 1.2; }}
              .label {{ font: 500 10px "Segoe UI", Ubuntu, sans-serif; fill: #565f89; }}

              .area {{ fill: url(#areaGlow); animation: fadeIn 2s ease-out forwards; }}
              .line {{
                fill: none;
                stroke: url(#neonLine);
                stroke-width: 3;
                stroke-linejoin: round;
                stroke-linecap: round;
                filter: url(#neonGlow);
                stroke-dasharray: 1200;
                stroke-dashoffset: 1200;
                animation: drawPath 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
              }}

              .dot {{ fill: #7dcfff; opacity: 0.7; }}
              .pulse-ring {{
                fill: none;
                stroke: #f7768e;
                animation: pulseRing 1.8s infinite ease-out;
              }}
              .latest-beacon {{
                animation: beaconPulse 1.8s infinite ease-in-out;
                filter: url(#neonGlow);
              }}

              .easy {{ fill: #9ece6a; font-weight: 700; }}
              .med {{ fill: #e0af68; font-weight: 700; }}
              .hard {{ fill: #f7768e; font-weight: 700; }}
            </style>

            <rect width="495" height="195" class="bg"/>
            
            <text x="22" y="28" class="title">📈 LeetCode Rating History</text>
            <text x="22" y="46" class="sub-text">Current: <tspan class="badge-val">{current_rating}</tspan>  |  Peak: <tspan class="badge-val">{peak_rating}</tspan>  |  Rank: <tspan class="badge-val">{global_rank}</tspan></text>
            
            <line x1="{pad_x}" y1="{pad_y_top}" x2="{width-pad_x}" y2="{pad_y_top}" class="grid" />
            <line x1="{pad_x}" y1="{height-pad_y_bottom}" x2="{width-pad_x}" y2="{height-pad_y_bottom}" class="grid" />
            <text x="{pad_x-8}" y="{pad_y_top+4}" text-anchor="end" class="label">{max_r}</text>
            <text x="{pad_x-8}" y="{height-pad_y_bottom+4}" text-anchor="end" class="label">{min_r}</text>

            <polygon points="{area_points}" class="area" />
            <polyline points="{poly_points}" class="line" />
            {dots_html}

            <circle cx="{last_x:.1f}" cy="{last_y:.1f}" r="4" class="pulse-ring" />
            <circle cx="{last_x:.1f}" cy="{last_y:.1f}" r="4" class="latest-beacon" />

            <text x="247" y="180" text-anchor="middle" class="sub-text">
              Total Solved: <tspan class="badge-val">{total}</tspan>  (
              <tspan class="easy">Easy: {easy}</tspan>  |  
              <tspan class="med">Med: {medium}</tspan>  |  
              <tspan class="hard">Hard: {hard}</tspan> )
            </text>
          </svg>"""

                  with open("leetcode.svg", "w", encoding="utf-8") as f:
                      f.write(svg)
                  print("Animated Cyberpunk LeetCode SVG generated successfully!")
          except Exception as e:
              print("Error generating SVG:", e)
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add leetcode.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Update animated cyberpunk LeetCode SVG"
          git push
