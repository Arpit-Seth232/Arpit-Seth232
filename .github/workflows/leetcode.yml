name: Update LeetCode Stats SVG

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'leetcode.svg'

jobs:
  update-leetcode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Data & Generate Aesthetic LeetCode SVG
        run: |
          python -c '
          import urllib.request
          import json

          username = "Arpit_Seth"
          query = """
          query getContestStats($username: String!) {
            matchedUser(username: $username) {
              submitStats {
                acSubmissionNum {
                  difficulty
                  count
                }
              }
            }
            userContestRanking(username: $username) {
              rating
              globalRanking
            }
            userContestRankingHistory(username: $username) {
              attended
              rating
            }
          }
          """

          req = urllib.request.Request(
              "https://leetcode.com/graphql",
              data=json.dumps({"query": query, "variables": {"username": username}}).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"}
          )

          try:
              with urllib.request.urlopen(req) as response:
                  res = json.loads(response.read().decode())
                  
                  stats = res["data"]["matchedUser"]["submitStats"]["acSubmissionNum"]
                  total = next(item["count"] for item in stats if item["difficulty"] == "All")
                  easy = next(item["count"] for item in stats if item["difficulty"] == "Easy")
                  medium = next(item["count"] for item in stats if item["difficulty"] == "Medium")
                  hard = next(item["count"] for item in stats if item["difficulty"] == "Hard")
                  
                  contest = res["data"].get("userContestRanking")
                  current_rating = round(contest.get("rating", 1691)) if contest else 1691
                  global_rank = f"{contest.get(\"globalRanking\"):,}" if contest and contest.get("globalRanking") else "N/A"
                  
                  history = res["data"].get("userContestRankingHistory") or []
                  attended = [c for c in history if c.get("attended")]
                  ratings = [round(c["rating"]) for c in attended] if attended else [1500, current_rating]
                  peak_rating = max(ratings) if ratings else current_rating

                  width, height = 495, 195
                  pad_x, pad_y_top, pad_y_bottom = 45, 65, 38
                  graph_w = width - (pad_x * 2)
                  graph_h = height - pad_y_top - pad_y_bottom
                  
                  min_r = min(ratings) - 20
                  max_r = max(ratings) + 20
                  r_range = max_r - min_r if max_r != min_r else 100

                  points = []
                  n = len(ratings)
                  for i, r in enumerate(ratings):
                      x = pad_x if n == 1 else pad_x + (i / (n - 1)) * graph_w
                      y = height - pad_y_bottom - ((r - min_r) / r_range) * graph_h
                      points.append((x, y))

                  poly_points = " ".join([f"{x:.1f},{y:.1f}" for x, y in points])
                  
                  # Create area polygon fill under line
                  area_points = f"{pad_x},{height-pad_y_bottom} " + poly_points + f" {width-pad_x},{height-pad_y_bottom}"

                  dots_html = ""
                  for idx, (x, y) in enumerate(points):
                      is_last = (idx == len(points) - 1)
                      dot_class = "latest-dot" if is_last else "dot"
                      dots_html += f"""<circle cx="{x:.1f}" cy="{y:.1f}" r="3" class="{dot_class}" />"""

                  svg = f"""<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#2ac3de" />
                <stop offset="50%" stop-color="#7aa2f7" />
                <stop offset="100%" stop-color="#bb9af7" />
              </linearGradient>
              
              <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.3" />
                <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.0" />
              </linearGradient>

              <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#16161e" />
                <stop offset="100%" stop-color="#0f0f14" />
              </linearGradient>

              <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3d59a1" stop-opacity="0.5"/>
                <stop offset="100%" stop-color="#bb9af7" stop-opacity="0.2"/>
              </linearGradient>

              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2.5" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>

            <style>
              @keyframes pulse {{
                0% {{ r: 3px; opacity: 0.8; }}
                50% {{ r: 5.5px; opacity: 1; }}
                100% {{ r: 3px; opacity: 0.8; }}
              }}
              .bg {{ fill: url(#cardBg); rx: 12px; stroke: url(#borderGrad); stroke-width: 1.5px; }}
              .title {{ font: 700 15px "Segoe UI", system-ui, sans-serif; fill: #7dcfff; letter-spacing: 0.3px; }}
              .badge-text {{ font: 700 12px "Segoe UI", system-ui, sans-serif; fill: #ff9e64; }}
              .sub-text {{ font: 500 11px "Segoe UI", system-ui, sans-serif; fill: #a9b1d6; }}
              .grid {{ stroke: #565f89; stroke-opacity: 0.2; stroke-dasharray: 4; }}
              .line {{ fill: none; stroke: url(#lineGrad); stroke-width: 2.8; stroke-linejoin: round; filter: url(#glow); }}
              .area {{ fill: url(#areaGrad); }}
              .label {{ font: 500 10px "Segoe UI", system-ui, sans-serif; fill: #565f89; }}
              .dot {{ fill: #2ac3de; stroke: #16161e; stroke-width: 1.2; }}
              .latest-dot {{ fill: #bb9af7; stroke: #ffffff; stroke-width: 1.5; animation: pulse 2s infinite ease-in-out; filter: url(#glow); }}
              .easy {{ fill: #9ece6a; font-weight: 700; }}
              .med {{ fill: #e0af68; font-weight: 700; }}
              .hard {{ fill: #f7768e; font-weight: 700; }}
            </style>

            <rect width="495" height="195" class="bg"/>
            
            <text x="25" y="28" class="title">📈 LeetCode Rating History</text>
            <text x="25" y="47" class="sub-text">Current: <tspan class="badge-text">{current_rating}</tspan>  |  Peak: <tspan class="badge-text">{peak_rating}</tspan>  |  Global Rank: <tspan class="badge-text">{global_rank}</tspan></text>
            
            <line x1="{pad_x}" y1="{pad_y_top}" x2="{width-pad_x}" y2="{pad_y_top}" class="grid" />
            <line x1="{pad_x}" y1="{height-pad_y_bottom}" x2="{width-pad_x}" y2="{height-pad_y_bottom}" class="grid" />
            <text x="{pad_x-8}" y="{pad_y_top+4}" text-anchor="end" class="label">{max_r}</text>
            <text x="{pad_x-8}" y="{height-pad_y_bottom+4}" text-anchor="end" class="label">{min_r}</text>

            <polygon points="{area_points}" class="area" />
            <polyline points="{poly_points}" class="line" />
            {dots_html}

            <text x="247" y="180" text-anchor="middle" class="sub-text">
              Total Solved: <tspan class="badge-text">{total}</tspan>  (
              <tspan class="easy">Easy: {easy}</tspan>  |  
              <tspan class="med">Med: {medium}</tspan>  |  
              <tspan class="hard">Hard: {hard}</tspan> )
            </text>
          </svg>"""

                  with open("leetcode.svg", "w", encoding="utf-8") as f:
                      f.write(svg)
                  print("Aesthetic LeetCode SVG generated successfully!")
          except Exception as e:
              print("Error generating SVG:", e)
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add leetcode.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Update aesthetic LeetCode SVG"
          git push
